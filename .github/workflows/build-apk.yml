name: Build debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          set -o pipefail
          if ! gradle assembleDebug --stacktrace 2>&1 | tee build.log; then
            # Surface the compile errors as a single annotation so they are readable via the API/UI
            MSG=$(grep -E -A4 "^e: |What went wrong|ERROR:|error:" build.log | grep -v "^\s*at " | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build errors::${MSG}"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smartdisplay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
